# home/ は ~ と同じ構造で置き、追跡中のファイルを1つずつリンクする。
# agent-skills/ はディレクトリごとリンクする。Codex はファイルへのシンボリックリンクの SKILL.md を読まない（v0.155.1）。
# [!.]* は .gitignore を外すため（glob のエントリーには exclude が効かない）。
[dotfiles]
"~" = { source = "home", mode = "symlink-each", manifest = "git", exclude = [".gitignore"] }
"~/.agents/skills/[!.]*" = "agent-skills/[!.]*"

# Claude Code は公式インストーラーで入れる。mise や npm で入れると自己更新が別の場所へ書き、古い版が起動する。
# pipefail がないと curl の失敗が成功扱いになる。
# fisher は未導入なら取得し、fisher update で fish_plugins に揃える（自身も一覧にある）。標準入力が端末でないと止まるので /dev/null をつなぐ。
# herdr の hook スクリプトは再インストールで上書きされるのでコミットせず、ここで書かせる。
[tasks.bootstrap]
depends = ["macos", "fonts", "git-hooks"]
run = [
  "command -v claude >/dev/null || { set -o pipefail; curl -fsSL https://claude.ai/install.sh | bash; }",
  "herdr integration install claude",
  "herdr integration install codex",
  "fish -c 'functions -q fisher; or curl -fsSL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source; and fisher update </dev/null'",
]

# 値はシステム設定のスライダー最大（KeyRepeat は小さいほど速い）。反映はログアウト後、Dock だけ killall で即時。
[tasks.macos]
run = [
  "defaults write -g com.apple.trackpad.scaling -float 3",
  "defaults write -g KeyRepeat -int 2",
  "defaults write com.apple.dock autohide -bool true",
  "killall Dock",
]

[tasks.fonts]
run = "scripts/install-fonts.sh"

# private リポジトリ名の混入を止める pre-commit を、このリポジトリでだけ有効にする。
[tasks.git-hooks]
run = "git config core.hooksPath scripts/git-hooks"
