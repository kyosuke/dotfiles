# 短い名前のツールはレジストリ既定（多くは aqua: 公式リリースをチェックサム検証して入れる）。
# JS 製 CLI は npm バックエンドで入れる。Node.js を上げても消えない。
# cf はベータ版しかないので prerelease で latest にプレリリースを含める。
# esa-cli はダウンロード数が少なく弾かれるので allow_low_downloads で許可する。
# fish はレジストリに無いので aqua を明示する。1password は aqua だと版を一覧できないので既定の vfox で入れる。
# mlx-whisper は pipx: で入れるので uv が要り、音声の読み込みに ffmpeg を呼ぶので両方を depends に入れる。
# 1password の行は betterleaks が password = "..." と誤検知するので betterleaks:allow で外す。
# herdr は自己更新すると mise の管理とずれるので、mise up で更新する。
# gwscli（Google 公式の Workspace CLI）は版付きの URL が無いので http: で版を rolling に固定する。mise up では更新されないので mise install -f http:gwscli で入れ直す。
[tools]
1password = "latest" # betterleaks:allow
betterleaks = "latest"
codex = "latest"
dotenvx = "latest"
gh = "latest"
herdr = "latest"
hunk = "latest"
node = "lts"
pnpm = "latest"
python = "latest"
uv = "latest"
yazi = "latest"
"aqua:fish-shell/fish-shell" = "latest"
"conda:ffmpeg" = "latest"
"pipx:mlx-whisper" = { version = "latest", depends = ["uv", "conda:ffmpeg"] }
"npm:cf" = { version = "latest", prerelease = true }
"npm:@esaio/esa-cli" = { version = "latest", allow_low_downloads = true }
"npm:svgo" = "latest"
"npm:wrangler" = "latest"
"github:can1357/oh-my-pi" = "latest"
"http:gwscli" = { version = "rolling", bin = "gwscli", platforms = { macos-arm64 = { url = "https://dl.google.com/workspace-cli/macos_silicon/gwscli" }, macos-x64 = { url = "https://dl.google.com/workspace-cli/macos_intel/gwscli" } } }

[settings]
idiomatic_version_file_enable_tools = ["node"]
self_update.auto = true
tool_update.global_auto = true
