# 短い名前のツールはレジストリ既定（多くは aqua: 公式リリースをチェックサム検証して入れる）。
# JS 製 CLI は npm バックエンドで入れる。Node.js を上げても消えない。
# cf はベータ版しかないので prerelease で latest にプレリリースを含める。
# esa-cli はダウンロード数が少なく弾かれるので allow_low_downloads で許可する。
# fish はレジストリに無いので aqua を明示する。1password は aqua だと版を一覧できないので既定の vfox で入れる。
# opencode 2 系は npm だけで配られ、postinstall でバイナリを置くので allow_builds で許可する。
# herdr と opencode は自己更新すると mise の管理とずれるので、mise up で更新する。
[tools]
1password = "latest"
codex = "latest"
dotenvx = "latest"
gh = "latest"
herdr = "latest"
hunk = "latest"
node = "lts"
pnpm = "latest"
yazi = "latest"
"aqua:fish-shell/fish-shell" = "latest"
"npm:cf" = { version = "latest", prerelease = true }
"npm:@esaio/esa-cli" = { version = "latest", allow_low_downloads = true }
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
"npm:svgo" = "latest"
"npm:wrangler" = "latest"
"github:can1357/oh-my-pi" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]
self_update.auto = true
tool_update.global_auto = true
