onboarding = false
# herdr の設定。デフォルトと異なる項目だけを書く。
# 全オプションの一覧は `herdr --default-config` で確認できる。

[terminal]
# fish を使う。ログインシェルは zsh のため、default_shell が空だと
# $SHELL 経由で zsh が起動してしまうので明示する。
# fish は mise で入れているのでパスを書かず名前で指定し、サーバーの PATH にある mise のシムから引く。
# サーバーは起動時の PATH を持ち続けるため、.zshenv を変えたあとはサーバーを起動し直す。
default_shell = "fish"
# macOS の既定(auto)はログインシェルとして argv[0] を "-fish" で起動する。
# mise のシムは argv[0] でツールを引くため "-fish is not a valid shim" で即終了してしまう。
# config.fish はログインかどうかに依存しないので、非ログインで起動する。
shell_mode = "non_login"

[theme]
name = "one-dark"
auto_switch = false

[ui]
agent_panel_sort = "spaces"

[ui.sidebar.agents]
row_gap = 1
# Agent から報告された作業概要を名前の下に表示する。未報告なら行ごと消える。
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
  ["$summary"],
]

[ui.sidebar.spaces]
row_gap = 1
